<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BODYCAM 3D</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090d;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      color: #f8fafc;
    }
    #gameCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Bodycam Lens & Vignette */
    #bodycamOverlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(circle at center,
          rgba(0,0,0,0) 50%,
          rgba(0,0,0,0.38) 78%,
          rgba(0,0,0,0.88) 100%);
    }
    #damageFlash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(220,38,38,0) 45%, rgba(220,38,38,0.65) 100%);
      transition: opacity 0.12s ease-out;
    }
    #healFlash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 6;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(34,197,94,0) 50%, rgba(34,197,94,0.45) 100%);
      transition: opacity 0.2s ease-out;
    }
    #camHud {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      pointer-events: none;
      display: none;
      align-items: center;
      gap: 8px;
      background: rgba(8, 11, 16, 0.6);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 1px;
    }
    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
      animation: blinkRec 1.1s infinite;
    }
    @keyframes blinkRec {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.2; }
    }

    /* Lobby Screen (Transparent over 3D scene) */
    #lobbyScreen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 18px;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(6,8,12,0.86) 0%, rgba(6,8,12,0.42) 48%, rgba(6,8,12,0.15) 100%);
    }
    .top-bar, .lobby-main, .lobby-footer {
      pointer-events: none;
    }
    .profile-box, .currency-group, .left-menu, .daily-card {
      pointer-events: auto;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .profile-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.82);
      border: 1px solid rgba(255,255,255,0.16);
      padding: 5px 10px;
      border-radius: 8px;
    }
    .avatar-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }
    .currency-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .curr-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255,255,255,0.16);
      padding: 5px 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12px;
    }
    .coin-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, #facc15, #ca8a04);
      color: #111;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
    }
    .gem-icon {
      width: 14px;
      height: 14px;
      transform: rotate(45deg);
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      border: 1px solid #bae6fd;
      display: inline-block;
    }
    .plus-btn {
      background: #22c55e;
      color: #052e16;
      border: none;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }
    .icon-gear-btn {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(255,255,255,0.16);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .lobby-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 1;
      gap: 12px;
      overflow-y: auto;
      padding: 6px 0;
    }
    .left-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 205px;
      max-width: 260px;
    }
    .brand-title {
      font-size: clamp(26px, 4.5vw, 44px);
      font-weight: 900;
      line-height: 0.96;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0,0,0,0.9);
    }
    .brand-title span.red {
      color: #ef4444;
    }
    .brand-sub {
      font-size: 10px;
      letter-spacing: 1.8px;
      color: #cbd5e1;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .menu-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(255,255,255,0.16);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
    }
    .menu-btn:active {
      transform: scale(0.98);
    }
    .menu-btn.start-btn {
      background: linear-gradient(90deg, #dc2626, #991b1b);
      border-color: #f87171;
      font-size: 14px;
      padding: 10px 14px;
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.45);
    }
    .badge-new {
      background: #ef4444;
      color: #fff;
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 800;
    }
    .daily-card {
      background: rgba(24, 24, 27, 0.88);
      border: 1px solid rgba(250, 204, 21, 0.5);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      max-width: 155px;
    }
    .daily-card .gift-box {
      font-size: 24px;
      margin-bottom: 3px;
    }
    .daily-card .d-title {
      color: #facc15;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    .daily-card .d-sub {
      font-size: 10px;
      color: #e2e8f0;
      margin-top: 2px;
    }
    .lobby-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #e2e8f0;
      text-transform: uppercase;
    }
    .lobby-footer .accent-red {
      color: #ef4444;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 35;
      background: rgba(2, 6, 15, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .modal-box {
      width: 100%;
      max-width: 540px;
      max-height: 86vh;
      overflow-y: auto;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      padding: 16px;
      touch-action: pan-y;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 8px;
    }
    .close-btn {
      background: #334155;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
    }
    .shop-item {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }
    .shop-btn {
      border: none;
      border-radius: 6px;
      padding: 8px 10px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      background: #2563eb;
      color: #fff;
    }
    .shop-btn.equipped {
      background: #16a34a;
    }
    .option-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      flex-wrap: wrap;
    }
    .seg-group {
      display: flex;
      gap: 6px;
    }
    .seg-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.16);
      padding: 7px 12px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .seg-btn.active {
      background: #ef4444;
      border-color: #fca5a5;
      color: #fff;
    }

    /* In-Game HUD & Touch Controls */
    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
    }
    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.88);
    }
    #crosshair::before {
      width: 2px;
      height: 18px;
      left: 8px;
      top: 0;
    }
    #crosshair::after {
      width: 18px;
      height: 2px;
      top: 8px;
      left: 0;
    }
    .hud-top-left {
      position: fixed;
      top: 12px;
      left: 14px;
      background: rgba(8,11,16,0.75);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 8px 12px;
      border-radius: 8px;
      min-width: 180px;
    }
    .hp-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .hp-bar-bg {
      width: 100%;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
    }
    .hp-bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ef4444, #22c55e);
      transition: width 0.15s ease;
    }
    .hud-stats {
      display: flex;
      gap: 10px;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .hud-top-right {
      position: fixed;
      top: 12px;
      right: 14px;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .hud-mini-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    #joystickZone {
      position: fixed;
      left: 18px;
      bottom: 18px;
      width: 126px;
      height: 126px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      pointer-events: auto;
    }
    #joystickKnob {
      position: absolute;
      left: 38px;
      top: 38px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(248, 250, 252, 0.5);
      border: 2px solid rgba(255,255,255,0.8);
      pointer-events: none;
    }
    #lookZone {
      position: fixed;
      top: 0;
      right: 0;
      width: 56%;
      height: 100%;
      pointer-events: auto;
      z-index: 9;
    }
    .action-pad {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 8px;
      z-index: 12;
      pointer-events: auto;
    }
    .act-btn {
      height: 52px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.22);
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
    }
    .act-btn.fire-btn {
      background: rgba(220, 38, 38, 0.9);
      border-color: #fca5a5;
      font-size: 12px;
    }
    .act-btn.med-btn {
      background: rgba(22, 163, 74, 0.88);
      border-color: #86efac;
    }

    #downScreen {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(10, 4, 4, 0.88);
      text-align: center;
      padding: 20px;
    }
    #toastMsg {
      position: fixed;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255,255,255,0.25);
      color: #f8fafc;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="bodycamOverlay"></div>
  <div id="damageFlash"></div>
  <div id="healFlash"></div>
  <div id="toastMsg"></div>

  <div id="camHud">
    <span class="rec-dot"></span>
    <span id="camStatusText">CAM 01 • LIVE</span>
  </div>

  <!-- LOBBY SCREEN -->
  <div id="lobbyScreen">
    <div class="top-bar">
      <div class="profile-box">
        <div class="avatar-circle">P</div>
        <div>
          <div id="lobbyPlayerName" style="font-weight:800;font-size:12px;">Player_123</div>
          <div style="font-size:9px;color:#94a3b8;">BODYCAM OPERATIVE</div>
        </div>
      </div>

      <div class="currency-group">
        <div class="curr-pill">
          <span class="coin-icon">$</span>
          <span id="lobbyCoins">250</span>
          <button class="plus-btn" id="quickCoinBtn" title="Bonus Coins">+</button>
        </div>
        <div class="curr-pill">
          <span class="gem-icon"></span>
          <span id="lobbyGems">10</span>
          <button class="plus-btn" id="quickGemBtn" title="Bonus Diamonds">+</button>
        </div>
        <button class="icon-gear-btn" id="openSettingsTop" title="Settings">⚙</button>
      </div>
    </div>

    <div class="lobby-main">
      <div class="left-menu">
        <div class="brand-title">BODY<span class="red">CAM</span><br>3D</div>
        <div class="brand-sub">Tactical Building Combat</div>

        <button class="menu-btn start-btn" id="startGameBtn">
          <span>▶ START GAME</span>
        </button>
        <button class="menu-btn" id="openSettingsBtn">
          <span>⚙ SETTINGS</span>
        </button>
        <button class="menu-btn" id="openControlsBtn">
          <span>🎮 CONTROLS</span>
        </button>
        <button class="menu-btn" id="openGraphicsBtn">
          <span>📊 GRAPHICS</span>
        </button>
        <button class="menu-btn" id="openStoreBtn">
          <span>🛒 STORE</span>
          <span class="badge-new">NEW</span>
        </button>
        <button class="menu-btn" id="quitLobbyBtn">
          <span>🚪 EXIT</span>
        </button>
      </div>

      <div class="daily-card" id="dailyRewardBtn">
        <div class="gift-box">🎁</div>
        <div class="d-title">DAILY REWARDS</div>
        <div class="d-sub" id="dailyStatusText">Tap to Claim!</div>
      </div>
    </div>

    <div class="lobby-footer">
      <div>SURVIVE. SHOOT. <span class="accent-red">WIN.</span></div>
      <div id="lobbyWeaponLabel">WEAPON: M4A1</div>
    </div>
  </div>

  <!-- IN-GAME HUD -->
  <div id="hud">
    <div id="crosshair"></div>

    <div class="hud-top-left">
      <div class="hp-label">
        <span>HP</span>
        <span id="hpText">200 / 200</span>
      </div>
      <div class="hp-bar-bg">
        <div class="hp-bar-fill" id="hpBar"></div>
      </div>
      <div class="hud-stats">
        <span>KILLS: <b id="killCountText">0</b></span>
        <span>$: <b id="hudCoins">250</b></span>
        <span>💎: <b id="hudGems">10</b></span>
      </div>
    </div>

    <div class="hud-top-right">
      <button class="hud-mini-btn" id="inGameGraphicsBtn">GFX</button>
      <button class="hud-mini-btn" id="backToLobbyBtn">LOBBY</button>
    </div>

    <div id="lookZone"></div>

    <div id="joystickZone">
      <div id="joystickKnob"></div>
    </div>

    <div class="action-pad">
      <button class="act-btn med-btn" id="medkitBtn">💊 MED<br><span id="medCountText">x2</span></button>
      <button class="act-btn" id="swapGunBtn">GUN<br><span id="gunSlotText">M4A1</span></button>
      <button class="act-btn" id="flashBtn">🔦 LIGHT</button>

      <button class="act-btn" id="zoomBtn">🔍 ZOOM</button>
      <button class="act-btn" id="reloadBtn">🔄 RELOAD</button>
      <button class="act-btn fire-btn" id="fireBtn">🔥 FIRE</button>
    </div>
  </div>

  <!-- OPERATIVE DOWN SCREEN -->
  <div id="downScreen">
    <h2 style="margin:0;color:#ef4444;font-size:28px;letter-spacing:1px;">CAM DISCONNECTED</h2>
    <p style="margin:0;color:#e2e8f0;font-size:14px;">
      Eliminations: <b id="downKills">0</b> • Earned: <b id="downEarned">$0 / 💎0</b>
    </p>
    <div style="display:flex;gap:12px;margin-top:6px;">
      <button class="menu-btn start-btn" id="respawnBtn">↻ RESPAWN (200 HP)</button>
      <button class="menu-btn" id="downLobbyBtn">🏠 LOBBY</button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalTitle" style="margin:0;font-size:17px;">MENU</h3>
        <button class="close-btn" id="closeModalBtn">✕ CLOSE</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'bodycam3d_save_v2';
      const MAX_HP = 200;

      const defaultSave = {
        name: 'Player_123',
        coins: 250,
        gems: 10,
        medkits: 2,
        kills: 0,
        ownedWeapons: ['m4a1', 'revolver'],
        equippedWeapon: 'm4a1',
        graphics: 'medium',
        sensitivity: 1.0,
        autoHeal: true,
        lastDailyClaim: 0
      };

      const WEAPONS = {
        m4a1: { id: 'm4a1', name: 'M4A1 Tactical', costCoins: 0, costGems: 0, damage: 34, fireRate: 0.14, color: 0x334155 },
        revolver: { id: 'revolver', name: '.357 Revolver', costCoins: 0, costGems: 0, damage: 78, fireRate: 0.36, color: 0x94a3b8 },
        ak74: { id: 'ak74', name: 'AK-74U Breacher', costCoins: 350, costGems: 0, damage: 44, fireRate: 0.15, color: 0x78350f },
        sniper: { id: 'sniper', name: 'Marksman SR-25', costCoins: 0, costGems: 15, damage: 140, fireRate: 0.65, color: 0x1e293b }
      };

      let save = loadSave();
      let gameActive = false;
      let playerHp = MAX_HP;
      let playerVelY = 0;
      let yaw = 0;
      let pitch = 0;
      let lastShotTime = 0;
      let lastDamageTime = 0;
      let sessionKills = 0;
      let sessionCoins = 0;
      let sessionGems = 0;
      let isZoomed = false;
      let isFiring = false;
      let bobTimer = 0;
      let threeReady = false;

      let scene, camera, renderer, dirLight, flashlight, gunGroup, gunBodyMesh, muzzleFlashMesh, lobbyCharacter;
      const colliders = [];
      const enemies = [];
      const SECOND_FLOOR_Y = 4.2;

      const spawnPoints = [
        { x: -10, y: 1.7, z: -8 },
        { x: 0, y: 1.7, z: -8 },
        { x: -10, y: 1.7, z: 8 },
        { x: 8, y: 1.7, z: 8 },
        { x: -9, y: SECOND_FLOOR_Y + 1.7, z: -7 },
        { x: -8, y: SECOND_FLOOR_Y + 1.7, z: 7 },
        { x: 2, y: SECOND_FLOOR_Y + 1.7, z: 8 }
      ];

      function loadSave() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { ...defaultSave };
          return { ...defaultSave, ...JSON.parse(raw) };
        } catch (e) {
          return { ...defaultSave };
        }
      }

      function persistSave() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(save));
        } catch (e) {}
        refreshUI();
      }

      let toastTimer = null;
      function showToast(msg) {
        const el = document.getElementById('toastMsg');
        if (!el) return;
        el.textContent = msg;
        el.style.opacity = '1';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
      }

        const clamped = Math.max(0, Math.min(MAX_HP, Math.round(playerHp)));

        document.getElementById('hpBar').style.width = `${(clamped / MAX_HP) * 100}%`;

        document.getElementById('lobbyPlayerName').textContent = save.name;

        document.getElementById('hudCoins').textContent = save.coins;

      function applyGraphicsSetting() {
        if (!threeReady || !renderer) return;
        const g = save.graphics;
        if (g === 'low') {
          renderer.setPixelRatio(0.75);
          renderer.shadowMap.enabled = false;
          if (dirLight) dirLight.castShadow = false;
          if (scene && scene.fog) scene.fog.density = 0.012;
        } else if (g === 'high') {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
          renderer.shadowMap.enabled = true;
          if (dirLight) dirLight.castShadow = true;
          if (scene && scene.fog) scene.fog.density = 0.02;
        } else {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
          renderer.shadowMap.enabled = true;
          if (dirLight) dirLight.castShadow = false;
          if (scene && scene.fog) scene.fog.density = 0.016;
        }
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function startGame() {
        try {
          applyGraphicsSetting();
          if (threeReady && camera) {
            camera.position.set(0, 1.7, 9.5);
            playerVelY = 0;
            yaw = 0;
            pitch = 0;
            if (lobbyCharacter) lobbyCharacter.visible = false;
            if (gunGroup) gunGroup.visible = true;
            populateEnemies(5);
          }
          playerHp = MAX_HP;
          sessionKills = 0;
          sessionCoins = 0;
          sessionGems = 0;
          if (save.medkits < 2) {
            save.medkits = 2;
            persistSave();
          }
          updateHpHud();

          gameActive = true;
          document.getElementById('downScreen').style.display = 'none';
          document.getElementById('lobbyScreen').style.display = 'none';
          document.getElementById('hud').style.display = 'block';
          document.getElementById('camHud').style.display = 'flex';
          document.getElementById('camStatusText').textContent = 'CAM 01 • LIVE';
          showToast('Combat Started — 200 HP Ready');
        } catch (err) {
          showToast('Start error: ' + err.message);
        }
      }

        gameActive = false;
        isFiring = false;
        isZoomed = false;

          camera.fov = 84;
          camera.updateProjectionMatrix();
          if (lobbyCharacter) lobbyCharacter.visible = true;
          if (gunGroup) gunGroup.visible = false;

        document.getElementById('downScreen').style.display = 'none';
        document.getElementById('camHud').style.display = 'none';
        document.getElementById('lobbyScreen').style.display = 'flex';

        document.getElementById('downKills').textContent = sessionKills;

      function useMedkit() {
        if (!gameActive) return;
        if (save.medkits <= 0) {
          showToast('No Medkits left! Buy in Store');
          return;
        }
        if (playerHp >= MAX_HP) {
          showToast('HP is already full (200)');
          return;
        }
        save.medkits -= 1;
        playerHp = Math.min(MAX_HP, playerHp + 90);
        updateHpHud();
        persistSave();
        const hf = document.getElementById('healFlash');
        hf.style.opacity = '1';
        setTimeout(() => { hf.style.opacity = '0'; }, 240);
        showToast('Medikit Used (+90 HP)');

        const fireBtn = document.getElementById('fireBtn');
        fireBtn.addEventListener('touchstart', () => { isFiring = true; });
        fireBtn.addEventListener('touchend', () => { isFiring = false; });
        fireBtn.addEventListener('touchcancel', () => { isFiring = false; });
        fireBtn.addEventListener('mousedown', () => { isFiring = true; });
        window.addEventListener('mouseup', () => { isFiring = false; });

        // Joystick
        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');
        let joyTouchId = null;
        let moveForward = 0;
        let moveRight = 0;

        function updateJoystick(touch) {
          const rect = joystickZone.getBoundingClientRect();
          const cx = rect.left + rect.width / 2;
          const cy = rect.top + rect.height / 2;
          const maxR = 40;
          let dx = touch.clientX - cx;
          let dy = touch.clientY - cy;
          const dist = Math.hypot(dx, dy);
          if (dist > maxR) {
            dx = (dx / dist) * maxR;
            dy = (dy / dist) * maxR;
          }
          joystickKnob.style.left = (cx - rect.left + dx - 25) + 'px';
          joystickKnob.style.top = (cy - rect.top + dy - 25) + 'px';
          moveRight = dx / maxR;
          moveForward = -dy / maxR;
        }

        joystickZone.addEventListener('touchstart', (e) => {
          const t = e.changedTouches[0];
          joyTouchId = t.identifier;
          updateJoystick(t);
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyTouchId) updateJoystick(e.changedTouches[i]);
          }
        }, { passive: false });

        function releaseJoystick(e) {
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === joyTouchId) {
              joyTouchId = null;
              moveForward = 0;
              moveRight = 0;
              joystickKnob.style.left = '38px';
              joystickKnob.style.top = '38px';
            }
          }
        }
        joystickZone.addEventListener('touchend', releaseJoystick);
        joystickZone.addEventListener('touchcancel', releaseJoystick);

        // Look zone
        const lookZone = document.getElementById('lookZone');
        let lookTouchId = null;
        let prevLookX = 0;
        let prevLookY = 0;

        lookZone.addEventListener('touchstart', (e) => {
          const t = e.changedTouches[0];
          lookTouchId = t.identifier;
          prevLookX = t.clientX;
          prevLookY = t.clientY;
        }, { passive: false });

        lookZone.addEventListener('touchmove', (e) => {
          for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (t.identifier === lookTouchId) {
              const dx = t.clientX - prevLookX;
              const dy = t.clientY - prevLookY;
              prevLookX = t.clientX;
              prevLookY = t.clientY;
              const sens = 0.0042 * save.sensitivity * (isZoomed ? 0.55 : 1);
              yaw -= dx * sens;
              pitch -= dy * sens;
              pitch = Math.max(-1.35, Math.min(1.35, pitch));
            }
          }
        }, { passive: false });

        function releaseLook(e) {
          for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === lookTouchId) lookTouchId = null;
          }
        }
        lookZone.addEventListener('touchend', releaseLook);
        lookZone.addEventListener('touchcancel', releaseLook);

        window.__getMoveInput = () => ({ moveForward, moveRight });
      }

      function addBox(x, y, z, w, h, d, color, isCollider = true) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({ color, roughness: 0.78, metalness: 0.1 })
        );
        mesh.position.set(x, y, z);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        if (isCollider) {
          colliders.push({
            minX: x - w / 2, maxX: x + w / 2,
            minY: y - h / 2, maxY: y + h / 2,
            minZ: z - d / 2, maxZ: z + d / 2
          });
        }
        return mesh;
      }

      function createEnemy(sp) {
        const group = new THREE.Group();
        const body = new THREE.Mesh(
          new THREE.BoxGeometry(0.75, 1.35, 0.55),
          new THREE.MeshStandardMaterial({ color: 0x3f4e3a, roughness: 0.7 })
        );
        body.position.y = -0.2;
        body.castShadow = true;

        const head = new THREE.Mesh(
          new THREE.BoxGeometry(0.45, 0.45, 0.45),
          new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.6 })
        );
        head.position.y = 0.72;
        head.castShadow = true;

        group.add(body, head);
        group.position.set(sp.x, sp.y, sp.z);
        scene.add(group);

        return {
          mesh: group,
          hp: 100,
          shootCooldown: 1.0 + Math.random() * 1.2,
          strafeDir: Math.random() > 0.5 ? 1 : -1,
          strafeTimer: 1.5 + Math.random() * 2
        };
      }

      function populateEnemies(count = 5) {
        while (enemies.length > 0) {
          const e = enemies.pop();
          scene.remove(e.mesh);
        }
        for (let i = 0; i < count; i++) {
          enemies.push(createEnemy(spawnPoints[i % spawnPoints.length]));
        }
      }

      function canOccupy(nx, ny, nz) {
        const r = 0.45;
        for (let i = 0; i < colliders.length; i++) {
          const c = colliders[i];
          if ((nx + r) > c.minX && (nx - r) < c.maxX &&
              (nz + r) > c.minZ && (nz - r) < c.maxZ &&
              (ny + 0.1) > c.minY && (ny - 1.7) < c.maxY) {
            return false;
          }
        }
        return true;
      }

      function initThreeScene() {
        if (typeof THREE === 'undefined') return;
        const canvas = document.getElementById('gameCanvas');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x161c26);
        scene.fog = new THREE.FogExp2(0x161c26, 0.016);

        camera = new THREE.PerspectiveCamera(84, window.innerWidth / window.innerHeight, 0.1, 140);
        renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const hemi = new THREE.HemisphereLight(0xb0c4de, 0x1e293b, 1.15);
        scene.add(hemi);

        dirLight = new THREE.DirectionalLight(0xf1f5f9, 1.3);
        dirLight.position.set(16, 26, 14);
        scene.add(dirLight);

        flashlight = new THREE.SpotLight(0xfffbeb, 2.8, 36, Math.PI / 5, 0.45, 1.2);
        flashlight.position.set(0.2, -0.15, 0);
        flashlight.target.position.set(0, 0, -10);
        camera.add(flashlight);
        camera.add(flashlight.target);
        scene.add(camera);

        gunGroup = new THREE.Group();
        gunBodyMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.11, 0.13, 0.56),
          new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.45, metalness: 0.5 })
        );
        gunBodyMesh.position.set(0.28, -0.24, -0.52);
        gunGroup.add(gunBodyMesh);

        muzzleFlashMesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
        );
        muzzleFlashMesh.position.set(0.28, -0.22, -0.84);
        muzzleFlashMesh.visible = false;
        gunGroup.add(muzzleFlashMesh);
        gunGroup.visible = false;
        camera.add(gunGroup);

        buildTwoStoryHouse();
        lobbyCharacter = buildLobbyCharacter();
        threeReady = true;
        applyGraphicsSetting();
        updateGunMesh();

        const raycaster = new THREE.Raycaster();
        function tryShoot(nowSec) {
          const w = WEAPONS[save.equippedWeapon] || WEAPONS.m4a1;
          if (nowSec - lastShotTime < w.fireRate) return;
          lastShotTime = nowSec;

          muzzleFlashMesh.visible = true;
          gunBodyMesh.position.z = -0.44;
          setTimeout(() => {
            muzzleFlashMesh.visible = false;
            gunBodyMesh.position.z = -0.52;
          }, 55);

          raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
          const hits = raycaster.intersectObjects(enemies.map(e => e.mesh), true);
          if (hits.length > 0) {
            let hitObj = hits[0].object;
            while (hitObj.parent && hitObj.parent !== scene) hitObj = hitObj.parent;
            const idx = enemies.findIndex(e => e.mesh === hitObj);
            if (idx !== -1) {
              enemies[idx].hp -= w.damage;
              if (enemies[idx].hp <= 0) {
                scene.remove(enemies[idx].mesh);
                enemies.splice(idx, 1);

                const rewardCoins = 45 + Math.floor(Math.random() * 25);
                const rewardGems = Math.random() < 0.35 ? 1 : 0;
                save.kills += 1;
                save.coins += rewardCoins;
                save.gems += rewardGems;
                sessionKills += 1;
                sessionCoins += rewardCoins;
                sessionGems += rewardGems;
                persistSave();
                showToast(`Enemy Down! +$${rewardCoins}${rewardGems ? ' +1💎' : ''}`);

                setTimeout(() => {
                  if (gameActive) {
                    enemies.push(createEnemy(spawnPoints[Math.floor(Math.random() * spawnPoints.length)]));
                  }
                }, 1600);
              }
            }
          }
        }

        let prevTime = performance.now();
        function animate(nowMs) {
          requestAnimationFrame(animate);
          const dt = Math.min(0.05, (nowMs - prevTime) / 1000);
          const nowSec = nowMs / 1000;
          prevTime = nowMs;

          if (gameActive) {
            const { moveForward, moveRight } = window.__getMoveInput();
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

            const forwardVec = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
            const rightVec = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
            const speed = (isZoomed ? 4.2 : 6.8) * dt;

            const dx = (forwardVec.x * moveForward + rightVec.x * moveRight) * speed;
            const dz = (forwardVec.z * moveForward + rightVec.z * moveRight) * speed;

            if (canOccupy(camera.position.x + dx, camera.position.y, camera.position.z)) camera.position.x += dx;
            if (canOccupy(camera.position.x, camera.position.y, camera.position.z + dz)) camera.position.z += dz;

            let groundHeight = 0.15;
            if (camera.position.x > 9.8 && camera.position.x < 12.6 && camera.position.z >= -8.5 && camera.position.z <= 2.2) {
              const prog = Math.max(0, Math.min(1, (2.2 - camera.position.z) / 10.2));
              groundHeight = 0.15 + prog * SECOND_FLOOR_Y;
            } else if (camera.position.y > 2.5) {
              const overSlab1 = camera.position.x >= -14 && camera.position.x <= 5 && camera.position.z >= -12 && camera.position.z <= 12;
              const overSlab2 = camera.position.x >= 5 && camera.position.x <= 12 && camera.position.z >= 3 && camera.position.z <= 12;
              const overSlab3 = camera.position.x >= 5 && camera.position.x <= 7.4 && camera.position.z >= -12 && camera.position.z <= 1;
              if (overSlab1 || overSlab2 || overSlab3) groundHeight = SECOND_FLOOR_Y + 0.18;
            }

            const targetEyeY = groundHeight + 1.65;
            if (camera.position.y > targetEyeY) {
              playerVelY -= 18 * dt;
              camera.position.y += playerVelY * dt;
              if (camera.position.y <= targetEyeY) {
                camera.position.y = targetEyeY;
                playerVelY = 0;
              }
            } else {
              camera.position.y += (targetEyeY - camera.position.y) * Math.min(1, dt * 14);
              playerVelY = 0;
            }

            if (Math.hypot(moveForward, moveRight) > 0.08) {
              bobTimer += dt * 11;
              gunGroup.position.y = Math.sin(bobTimer) * 0.015;
              gunGroup.position.x = Math.cos(bobTimer * 0.5) * 0.012;
            } else {
              gunGroup.position.y *= 0.85;
              gunGroup.position.x *= 0.85;
            }

            if (isFiring) tryShoot(nowSec);

            if (save.autoHeal && playerHp > 0 && playerHp < MAX_HP && (nowSec - lastDamageTime) > 4.5) {
              playerHp = Math.min(MAX_HP, playerHp + 10 * dt);
              updateHpHud();
            }

            for (let i = 0; i < enemies.length; i++) {
              const en = enemies[i];
              const toPlayer = new THREE.Vector3().subVectors(camera.position, en.mesh.position);
              const dist = toPlayer.length();
              en.mesh.lookAt(camera.position.x, en.mesh.position.y, camera.position.z);

              if (dist > 5.5 && dist < 24) {
                const dir = toPlayer.clone().normalize();
                const step = 2.1 * dt;
                const nextX = en.mesh.position.x + dir.x * step;
                const nextZ = en.mesh.position.z + dir.z * step;
                if (canOccupy(nextX, en.mesh.position.y + 0.5, nextZ)) {
                  en.mesh.position.x = nextX;
                  en.mesh.position.z = nextZ;
                }
              }

              en.shootCooldown -= dt;
              if (dist < 22 && en.shootCooldown <= 0) {
                en.shootCooldown = 1.15 + Math.random() * 0.8;
                if (Math.random() < 0.55) {
                  const dmg = 14 + Math.floor(Math.random() * 10);
                  playerHp -= dmg;
                  lastDamageTime = nowSec;
                  updateHpHud();

                  const df = document.getElementById('damageFlash');
                  df.style.opacity = '1';
                  pitch += (Math.random() - 0.5) * 0.05;
                  yaw += (Math.random() - 0.5) * 0.05;
                  setTimeout(() => { df.style.opacity = '0'; }, 140);

                  if (playerHp <= 0) {
                    triggerPlayerDown();
                    break;
                  }
                }
              }
            }
          } else {
            camera.position.set(0.4, 1.9, 10.2);
            camera.lookAt(0.8, 1.2, 4.0);
          }

          renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        requestAnimationFrame(animate);
      }

      bindUIEvents();
      refreshUI();

      const scriptUrls = [
        'https://unpkg.com/three@0.160.0/build/three.min.js',
        'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js'
      ];

      function loadThreeFallback(index) {
        if (index >= scriptUrls.length) return;
        const s = document.createElement('script');
        s.src = scriptUrls[index];
        s.onload = () => initThreeScene();
        s.onerror = () => loadThreeFallback(index + 1);
        document.body.appendChild(s);
      }

      loadThreeFallback(0);
    })();
  </script>
</body>
</html>
